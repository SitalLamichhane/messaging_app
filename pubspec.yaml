name: messaging_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.9.2
  http: ^1.2.2
  http_parser: ^4.0.2
  web_socket_channel: ^3.0.1

  # Storage
  flutter_secure_storage: ^10.2.0
  path_provider: ^2.1.5

  # State Management
  flutter_riverpod: ^2.6.1
  provider: ^6.1.5+1

  # Phone / Auth
  intl_phone_field: ^3.2.0

  # Media
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  video_player: ^2.8.2
  file_picker: ^8.0.7

  # Audio
  audioplayers: ^6.1.0
  just_audio: ^0.10.5
  record: ^6.1.1

  # Chat
  emoji_picker_flutter: ^4.4.0

  # WebRTC Calling
  flutter_webrtc: ^1.4.1

  # Permissions
  permission_handler: ^12.0.1

  # Gallery Save
  saver_gallery: ^4.1.1

  # Utilities
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

assets:
  - assets/sounds/incoming_call.mp3
  - assets/sounds/outgoing_call.mp3