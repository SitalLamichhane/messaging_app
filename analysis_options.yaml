
# Flutter recommended lint configuration
include: package:flutter_lints/flutter.yaml

# Dart analyzer configuration
analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - local_plugins/**

# Project-specific lint rules
linter:
  rules:
    # avoid_print: false
    # prefer_single_quotes: true
